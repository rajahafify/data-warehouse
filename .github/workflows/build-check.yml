name: Build check

# Bundles the Worker without deploying it, so build errors show up in GitHub.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Bundle Worker (dry run)
        run: npx wrangler deploy --dry-run --outdir dist

      - name: Type check
        run: npx tsc --noEmit
